
<!DOCTYPE html>
<html>
<head>
    <title>PDF Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .search-container {
            text-align: center;
            margin-top: 100px;
        }
        .search-box {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .search-button {
            padding: 10px 20px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        h1 {
            color: #333;
        }
        footer {
            margin-top: 50px;
            text-align: center;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <h1>PDF Document Search</h1>
        <p>Search through OCR'd PDF documents</p>
        <form action="/search" method="get">
            <input type="text" name="q" class="search-box" placeholder="Enter search terms...">
            <button type="submit" class="search-button">Search</button>
        </form>
    </div>
    <footer>
        <p>Powered by Python, Flask, Tesseract OCR and Whoosh</p>
    </footer>
</body>
</html>
